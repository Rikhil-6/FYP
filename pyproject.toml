[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fyp-temporal-vit"
version = "0.4.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.45,<5",
    "wilds>=2.0",
    "numpy>=1.26",
    "pillow>=10",
    "tqdm>=4.66",
    "filelock>=3",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "wild-time-data>=0.1.1",
    "datasets>=3,<5",
]

[project.scripts]
fyp-analyze-saliency = "fyp_drift.evaluation.saliency:main"
fyp-audit-router = "fyp_drift.evaluation.audit:main"
fyp-compare-runs = "fyp_drift.evaluation.compare_runs:main"
fyp-export-classwise = "fyp_drift.evaluation.classwise:main"
fyp-evaluate = "fyp_drift.evaluation.classifier:main"
fyp-evaluate-drift = "fyp_drift.evaluation.drift:main"
fyp-evaluate-router-drift = "fyp_drift.evaluation.router_drift:main"
fyp-verify-drift = "fyp_drift.evaluation.drift_verification:main"
fyp-replicate-wilds = "fyp_drift.evaluation.wilds_replication:main"
fyp-replicate-yearbook = "fyp_drift.evaluation.yearbook_replication:main"
fyp-replicate-cifar = "fyp_drift.evaluation.cifar_replication:main"
fyp-replicate-camelyon = "fyp_drift.evaluation.camelyon_replication:main"
fyp-summarise-replications = "fyp_drift.evaluation.replication_summary:main"
fyp-experiment = "fyp_drift.workflows.experiment:main"
fyp-export-router-report = "fyp_drift.artifacts.router_report:main"
fyp-hardware = "fyp_drift.system.hardware:main"
fyp-ingest = "fyp_drift.data.ingestion:main"
fyp-ingest-acdc = "fyp_drift.data.acdc:main"
fyp-audit-data = "fyp_drift.data.validation:main"
fyp-audit-adaptation = "fyp_drift.evaluation.adaptation_evidence:main"
fyp-screen-acdc = "fyp_drift.evaluation.acdc_screen:main"
fyp-preview-drift = "fyp_drift.visualization.drift:main"
fyp-save-model = "fyp_drift.artifacts.snapshots:main"
fyp-show-router = "fyp_drift.visualization.router:main"
fyp-show-saliency = "fyp_drift.visualization.saliency:main"
fyp-smoke = "fyp_drift.system.smoke:main"
fyp-train = "fyp_drift.training.classifier:main"
fyp-train-router = "fyp_drift.training.temporal_router:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/fyp_drift"]
